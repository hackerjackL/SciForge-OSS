# AtomGit Actions CI for SciForge-OSS — single entry point: scripts/ci_check.py
#
# Format assumptions (documented because `ag run --help` only inspects runs
# and does not document the workflow schema):
#   - AtomGit Actions reads workflow YAML from the repository's `.workflow/`
#     directory (atomgit.com convention). The AtomGit/GitCode help docs also
#     describe `.gitcode/workflows/<name>.yml` with the same schema; if your
#     instance reads that path instead, copy this file there unchanged.
#   - Schema is Gitea/GitHub-Actions style: name / on / jobs.<id>.steps,
#     plain `run:` shell steps, stages serial / jobs parallel.
#   - The runner needs git, bash, and python3 (>= 3.8). Nothing else:
#     scripts/ci_check.py is Python stdlib only (no pip installs).
#
# Contributors without AtomGit CI get the same gate via
# .pre-commit-config.yaml (repo: local hook running the same command).
name: CI

on:
  push:
  pull_request:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      # Minimal pair: checkout + the single CI command.
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run SciForge CI checks (links + versions + plotting)
        run: python3 scripts/ci_check.py
